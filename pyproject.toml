[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-filter-bot"
version = "0.1.0"
description = "Subscribe to public Telegram channels, filter posts with Jev judgments, route matches to DMs or channels."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andong Hu", email = "hu7006@outlook.com" }]
license = "MIT"
keywords = ["telegram", "telegram-bot", "typesafe", "jev", "message-router", "content-filtering"]
dependencies = [
    "python-telegram-bot[job-queue]>=21.6,<23",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tg-filter-bot = "tgfilter.__main__:main"

[project.urls]
Homepage = "https://github.com/HuXioAn/jev-telegram-channel-router"
Repository = "https://github.com/HuXioAn/jev-telegram-channel-router"
Issues = "https://github.com/HuXioAn/jev-telegram-channel-router/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tgfilter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
